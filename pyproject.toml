[project]
name = "ha-light-manager"
version = "0.1.0"
description = "Home Assistant integration: dim the active scene of a room relative to its scene brightness"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# E501: left to the formatter. RUF012: HA entities use mutable _attr_* class defaults.
ignore = ["E501", "RUF012"]
